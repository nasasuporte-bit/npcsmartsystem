/* NPC SMART — interface preto grafite e dourado */
@media screen {
  :root {
    --bg: #101113;

  body {
    font-family: Inter, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea {
    font-family: inherit;
  }

  button {
    min-height: 39px;
    border-radius: 10px;
    padding: 9px 14px;
    border-color: #3d4047;
    background: #26292e;
    color: #e5e6e8;
    font-weight: 500;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    transition: background 140ms ease, border-color 140ms ease,
      box-shadow 140ms ease, transform 140ms ease;
  }

  button:hover:not(:disabled) {
    background: #303339;
    border-color: #8d7951;
    color: #f8e1b3;
    box-shadow: 0 3px 10px #00000024;
  }

  button:active:not(:disabled) {
    transform: translateY(1px);
  }

  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--gold-light);
    outline-offset: 3px;
  }

  button.primary {
    background: linear-gradient(180deg, #dfbf7b, #c8a65e);
    border-color: #e2c788;
    color: #1d1911;
    box-shadow: inset 0 1px 0 #fff4d64d, 0 3px 12px #b48c2c13;
    font-weight: 700;
  }

  button.primary:hover:not(:disabled) {
    background: linear-gradient(180deg, #edd29c, #d5b471);
    border-color: #f0d99e;
    color: #17140e;
    box-shadow: 0 4px 15px #c6a25826;
  }

  button.danger {
    color: #f3a49d;
    border-color: #644440;
    background: #302221;
  }

  button.danger:hover:not(:disabled) {
    background: #432a28;
    border-color: #a5675f;
    color: #ffd6d0;
  }

  button.small {

    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
  }

  input, select, textarea {
    border-radius: 9px;
    border-color: #41444a;
    background: #121417;
    color: #f0f0f1;
    padding: 10px 12px;
    min-height: 40px;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }

  input:hover, select:hover, textarea:hover {
    border-color: #62605a;
  }

  input:focus, select:focus, textarea:focus {
    border-color: #c6a764;
    box-shadow: 0 0 0 3px #d0af681a;
  }

  input::placeholder, textarea::placeholder {
    color: #8b8e95;
  }

  input[readonly] {
    background: #202226;
    color: #b6b8be;
    border-color: #35383d;
  }

  input[type=checkbox] {

    width: 16px;
    height: 16px;
    accent-color: var(--gold);
  }

  label {
    color: #c4c6cb;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.5;
  }

    color: #f0d499;
    font-size: 21px;
    letter-spacing: 1.4px;
    line-height: 1.2;
  }

  .brand small {
    margin-top: 7px;

    font-size: 11px;
    letter-spacing: .2px;
    line-height: 1.3;

  .top-actions {

  }

    padding: 7px 12px;
    font-size: 12px;

  }

    margin-bottom: 16px;

    background: #1a1c1f;
    border-color: #33363b;
    box-shadow: 0 4px 16px #00000016;
  }

  .panel.accent {

  }

  .table-wrap {
    background: #191b1f;
    border: 1px solid #373a3f;

    margin-bottom: 16px;

    scrollbar-color: #63605a #1a1c1f;
  }

  table {

  }

  th {

  }

  td {

  td .small {

  .empty {

  }

  .state {
    border-radius: 7px;
    padding: 5px 9px;
    background: #302a1e;
    border-color: #665436;
    color: #e1c798;
    font-size: 11px;
  }

  .state.done {
    background: #1e3028;
    border-color: #385946;
    color: #afd4ba;
  }

  .totals {
    padding: 17px 18px;
    gap: 24px;
    border-radius: 11px;
    background: #28251e;
    border-color: #5a4a30;
    color: #cbc2ae;
  }

  .totals strong {
    color: #f2d296;
    font-size: 24px;
    letter-spacing: -.5px;
  }

  .summary {
    gap: 14px;
    margin-bottom: 18px;
  }

  .metric {
    padding: 20px;
    border-radius: 14px;
    border-color: #373a40;
    background: #1b1d21;
    box-shadow: inset 0 1px 0 #ffffff03;
  }

  .metric span {
    color: #a4a7ae;
    font-size: 12px;
    margin-bottom: 12px;
  }

  .metric strong {
    color: #ead2a5;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -.5px;
  }

  .subnav {
    gap: 7px;
    margin-bottom: 17px;
  }

  .subnav button {
    background: #1c1e22;
    border-color: #373a40;
    color: #bfc1c7;
    border-radius: 9px;
    font-size: 12px;
  }

  .subnav button.active {
    background: #332b1d;
    border-color: #72603a;
    color: #f0d499;
  }

  dialog {
    width: min(1050px, calc(100vw - 30px));
    max-height: 91vh;
    border-radius: 19px;
    border-color: #645336;
    background: #1a1c20;
    box-shadow: 0 28px 100px #00000080;
  }

  dialog::backdrop {
    background: #050608bb;
    backdrop-filter: blur(5px);
  }

  .dialog-head {
    padding: 18px 22px;
    border-bottom-color: #3e3b33;
    background: #212327;
  }

  .dialog-head h2 {
    font-size: 19px;
    font-weight: 600;
    color: #eee3cc;
    letter-spacing: -.25px;
  }

  .dialog-head button {
    width: 32px;
    height: 32px;
    min-height: 32px;
    padding: 0;
    border-radius: 9px;
    background: #2c2e33;
    color: #bfc0c5;
    border-color: #42444b;
  }

  .dialog-body {
    padding: 23px;
  }

  .dialog-body .panel {
    background: #17191c;
    box-shadow: none;
  }

  .auth-wrap {
    padding: 30px;
    background:
      radial-gradient(ellipse at 20% 0%, #52432b36, transparent 55%),
      radial-gradient(ellipse at 100% 100%, #24262c66, transparent 60%),
      #101113;
  }

  .auth-card {
    padding: 34px;
    border-radius: 21px;
    border-color: #5a4d34;
    background: linear-gradient(160deg, #212225, #17191c);
    box-shadow: 0 24px 80px #00000040;
  }

  .auth-card .brand {
    font-size: 29px;
    letter-spacing: 1.5px;
    margin-bottom: 28px;
  }

  .auth-card h2 {
    font-size: 21px;
    font-weight: 500;
    color: #e8e5de;
    margin-bottom: 20px;
  }

  .auth-card label {
    margin: 16px 0;
  }

  .auth-card button {
    min-height: 44px;
    border-radius: 10px;
    margin-top: 15px;
  }

  .stock-peek {
    width: min(1000px, 100%);
  }

  .notice {
    border-radius: 9px;
    padding: 13px 16px;
    background: #2c271d;
    border-left-color: #c5a468;
    color: #d9cdb6;
  }

  .help {
    color: #a8abb3;
    font-size: 12px;
    line-height: 1.65;
  }

  .subtle, .statusbar {
    color: #93969e;
    font-size: 11px;
    line-height: 1.6;
  }

  .statusbar {
    padding: 13px 28px;
    background: #15171a;
    border-top-color: #303238;
  }

  #toast {
    border-radius: 12px;
    padding: 14px 19px;
    border-color: #8a7247;
    background: #30291d;
    color: #f5dfb2;
    box-shadow: 0 10px 35px #00000050;
  }

  .bar-track {
    border-radius: 6px;
    background: #2c2f34;
    height: 16px;
  }

  .bar {
    background: linear-gradient(90deg, #937b4b, #d3b270);
    border-radius: 6px;
  }

  .form-error:empty {
    margin: 0;
  }

  .payments .pay-row {
    grid-template-columns: 1fr 160px 39px;
    gap: 10px;
    margin-bottom: 11px;
  }

  button[data-action]::before {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    background: currentColor;
    -webkit-mask: var(--button-icon) center / contain no-repeat;
    mask: var(--button-icon) center / contain no-repeat;
  }

  button[data-action="new-order"]::before,
  button[data-action="new-record"]::before,
  button[data-action="new-bill"]::before,
  button[data-action="add-cart"]::before,
  button[data-action="order-add-line"]::before,
  button[data-action="add-payment"]::before,
  button[data-action="new-user"]::before,
  button[data-action="print-order"]::before,
  button[data-action="receipt"]::before,
  button[data-action="print-labels"]::before,
  button[data-action="print-cash-summary"]::before,
  button[data-action="edit-record"]::before,
  button[data-action="edit-order"]::before,
  button[data-action="edit-user"]::before,
  button[data-action="backup"]::before,
  button[data-action="restore"]::before,
  button[data-action="lock"]::before,
  button[data-action="logout"]::before {
    content: "";
  }

  @media (max-width: 1050px) {
    .topbar {
      padding: 16px 20px;
    }

    .nav {
      padding: 8px 14px;
    }

    .nav button {
      min-width: 74px;
    }

    main {
      padding: 22px 19px;
    }
  }

  @media (max-width: 850px) {
    .split {
      grid-template-columns: 1fr;
    }

    .metric {
      padding: 16px;
    }

    .metric strong {
      font-size: 21px;
    }

    .payments .pay-row {
      grid-template-columns: 1fr 112px 37px;
    }
  }

  @media (max-width: 520px) {
    .topbar {
      padding: 15px;
      min-height: 75px;
      gap: 12px;
    }

    .brand {
      font-size: 18px;
    }

    .brand small {
      max-width: 170px;
      font-size: 10px;
    }

    .top-actions {
      gap: 6px;
    }

    .top-actions button {
      font-size: 11px;
      padding: 6px 9px;
      min-height: 33px;
    }

    .nav {
      padding: 7px 9px;
    }

    main {
      padding: 19px 12px;
    }

    .section-head {
      gap: 10px;
      align-items: center;
    }

    .section-head h2 {
      font-size: 22px;
    }

    .section-head button {
      padding: 8px 11px;
      font-size: 12px;
    }

    .panel {
      padding: 15px;
      border-radius: 12px;
    }

    .dialog-body {
      padding: 16px;
    }

    .dialog-head {
      padding: 15px 16px;
    }

    .dialog-head h2 {
      font-size: 17px;
    }

    .auth-wrap {
      padding: 18px;
    }

    .auth-card {
      padding: 25px 20px;
    }

    td, th {
      padding: 11px;
    }

    .statusbar {
      padding: 13px 16px;
      flex-direction: column;
      gap: 4px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    button, input, select, textarea, tbody tr {
      transition: none;
    }
  }
}

function authFormError(error){

 }

function updateOrderTotal(){

  const form=$('[data-form="order"]');if(!form)return;
  const d=dialogState.draft;
  const total=sum(d.lines.map(l=>l.qty*l.price))+cents(form.elements.labor.value)+cents(form.elements.surcharge.value)-cents(form.elements.discount.value);
  $('#order-total').textContent=money(total);
 }catch{$('#order-total').textContent='Confira os valores';}
}

function updatePaymentTotal(){
 const form=$('[data-form="checkout"]');if(!form)return;
 try{
  const total=dialogState.gross+cents(form.elements.surcharge.value)-cents(form.elements.discount.value);
  dialogState.total=total;$('#checkout-total').textContent=money(total);
  const difference=total-sum(dialogState.pays.map(p=>p.amount));
  $('#payment-balance').textContent=difference===0?'Pagamentos conferidos.':difference>0?'Falta distribuir '+money(difference)+'.':'Os pagamentos superam o total em '+money(-difference)+'.';
 }catch{$('#payment-balance').textContent='Confira os valores informados.';}
}

const deviceConditions={new:'Novo',used:'Seminovo'};
const deviceMethods=()=>Object.entries(methods).filter(([key])=>['pix','cash','debit','credit'].includes(key));
function deviceDueDate(first,offset){
 const [year,month,day]=first.split('-').map(Number);
 const target=new Date(Date.UTC(year,month-1+offset,1));
 const last=new Date(Date.UTC(target.getUTCFullYear(),target.getUTCMonth()+1,0)).getUTCDate();
 target.setUTCDate(Math.min(day,last));
 return target.toISOString().slice(0,10);
}
function makeDeviceInstallments(balance,count,first){
 if(!Number.isInteger(count)||count<1||count>60||balance<count)fail('Informe de 1 a 60 parcelas, com pelo menos R$ 0,01 em cada.');
 const base=Math.floor(balance/count),rest=balance%count;
 return Array.from({length:count},(_,i)=>({number:i+1,due:deviceDueDate(first,i),amount:base+(i<rest?1:0)}));
}
function deviceParcelPayment(sale,parcel){
 return sale.payments.find(p=>p.kind==='receipt'&&p.deviceInstallment===parcel.number);
}
function deviceDueAlerts(){
 if(session.role!=='admin')return '';
 const nowDate=today(),limit=new Date(nowDate+'T12:00:00Z');
 limit.setUTCDate(limit.getUTCDate()+7);
 const through=limit.toISOString().slice(0,10);
 const rows=data.sales.filter(s=>s.deviceSale&&s.cancelled<s.total).flatMap(s=>
  s.deviceSale.installments.filter(p=>p.due<=through&&!deviceParcelPayment(s,p)).map(p=>[s,p])
 ).sort((a,b)=>a[1].due.localeCompare(b[1].due));
 const overdue=rows.filter(([,p])=>p.due<nowDate).length;
 const dueToday=rows.filter(([,p])=>p.due===nowDate).length;
 return '<section class="panel"><div class="npc-section-head"><h3>Parcelas de aparelhos</h3>'+button('nav','Ver vendas de aparelhos','devices','small')+'</div>'+
  '<div class="summary">'+metric('Vencidas',number(overdue))+metric('Vencem hoje',number(dueToday))+metric('Próximos 7 dias',number(rows.length-overdue-dueToday))+'</div>'+
  (rows.length?table(['Vencimento','Cliente','Aparelho','Parcela','Valor',''],rows.slice(0,8).map(([s,p])=>[
   date(p.due),esc(s.client.name),esc(s.deviceSale.model),String(p.number),money(p.amount),button('device-details','Abrir venda',s.id,'small')
  ])):'<p class="help">Nenhuma parcela vencida ou a vencer nos próximos sete dias.</p>')+'</section>';
}

   const shift=requireShift(db);ledger(db,shift,method,-b.amount,'Conta '+b.number+' — '+b.name,{billId:b.id});
   b.status='Pago';b.paidAt=now();b.method=method;b.version++;
  });closeDialog();renderMain();toast('Pagamento registrado.');
 },
 async 'cancel-sale'(form){
  const state=dialogState,reason=form.elements.reason.value.trim();if(!reason)fail('Informe o motivo.');
  await transaction(db=>{
   const sale=db.sales.find(s=>s.id===state.saleId);version(sale,state.version);
   const shift=shiftForSaleDate(db,today());
   const deltas=sale.lines.map((l,i)=>integer(form.elements['qty-'+i].value,'Quantidade para cancelar'));
   if(!sum(deltas))fail('Informe a quantidade a cancelar em pelo menos um item.');
   let cancelAmount=0;
   sale.lines.forEach((l,i)=>{
    const qty=deltas[i];if(qty>l.qty-l.cancelQty)fail('A quantidade para cancelar supera o saldo de '+l.name+'.');
    const before=Math.floor(l.net*l.cancelQty/l.qty);
    const after=Math.floor(l.net*(l.cancelQty+qty)/l.qty);
    cancelAmount+=after-before;l.cancelQty+=qty;
    if(qty&&l.type==='product'){const p=db.products.find(p=>p.id===l.productId);if(!p)fail('O cadastro do produto foi removido.');p.qty+=qty;p.version++;}
   });
   const refundAmount=Math.max(0,paid(sale)-refunded(sale)-(sale.total-sale.cancelled-cancelAmount));
   const real=Object.keys(methods).filter(m=>m!=='debt'&&m!=='other');
   const balances=real.map(m=>sum(sale.payments.filter(p=>p.method===m).map(p=>p.amount))-sum(sale.refunds.filter(p=>p.method===m).map(p=>p.amount)));
   const refunds=allocate(refundAmount,balances);
   real.forEach((m,i)=>{if(refunds[i]){sale.refunds.push({id:id(),date:today(),method:m,amount:refunds[i]});const registered=Math.max(0,sum(db.ledger.filter(e=>e.saleId===sale.id&&e.method===m).map(e=>e.amount)));const cashRefund=Math.min(refunds[i],registered);if(cashRefund)ledger(db,shift,m,-cashRefund,'Estorno da venda '+sale.number,{saleId:sale.id});}});
   sale.cancelled+=cancelAmount;sale.version++;
   sale.cancellations.push({id:id(),date:today(),createdAt:now(),reason,amount:cancelAmount,quantities:deltas,user:session.name});
  });closeDialog();renderMain();toast('Cancelamento gravado, com estoque e pagamentos atualizados.');
 },

function cashEntryGroup(entry){
 if(entry.carryover)return 'carryover';
 if(entry.legacyType==='sale_payment')return entry.amount<0?'refund':'sales';
 if(entry.saleId){
  if(entry.amount<0)return 'refund';
  return entry.kind==='receipt'||String(entry.description).startsWith('Recebimento da venda ')?'receipt':'sales';
 }
 if(entry.billId)return 'bills';
 if(entry.legacyType==='closing')return 'closing';
 return ({open:'opening',opening:'opening',in:'addition',cash_in:'addition',out:'withdrawal',withdrawal:'withdrawal',expense:'expense'})[entry.kind||entry.legacyType]||'other';
}

 for(const entry of rows){
  const group=cashEntryGroup(entry);
  groupTotals.set(group,(groupTotals.get(group)||0)+entry.amount);
  if(group==='sales')salesTotals.set(entry.method,(salesTotals.get(entry.method)||0)+entry.amount);
 }
 const salesTotal=groupTotals.get('sales')||0;
 const clear=interactive&&methodFilter?button('cash-filter-payment','Mostrar todos',scope+':all','small'):'';
 const ledgerSummary=[...groups,['net','Total dos movimentos']].map(([key,label])=>{
  const amount=key==='net'?sum(rows.map(row=>row.amount)):(groupTotals.get(key)||0)+(key==='withdrawal'?closedWithdrawals:0);
  const detail=key==='withdrawal'&&closedWithdrawals?'<br><small>De caixas fechados'+(scope==='current'?' hoje':'')+' · '+money(closedWithdrawals)+'</small>':'';
  return '<div class="npc-ledger-row"><span>'+label+detail+'</span><strong class="'+(amount<0?'error':'')+'">'+money(amount)+'</strong></div>';
 }).join('');

 }).join('');

 const visible=methodFilter?rows.filter(e=>cashEntryGroup(e)==='sales'&&e.method===methodFilter):rows;

 const details=table(['Data do lançamento','Descrição','Forma','Entrada / saída','Operador',...(canMove?['Ações']:[])],visible.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)).map(e=>[date(e.date),esc(e.description),esc(methods[e.method]),money(e.amount),esc(e.user),...(canMove?[canReclassifyCash(e)?button('reclassify-cash','Vincular a caixa fechado',e.id,'small'):'']:[])]));
 return grid+(methodFilter?'<p class="help">Vendas em '+esc(methods[methodFilter])+'</p>':'')+details;

function periodCashEntries(from,to){
 const entries=data.ledger.filter(e=>e.date>=from&&e.date<=to).map(e=>({...e}));
 const represented=new Map();
 for(const e of entries){if(e.saleId&&e.amount>0){const k=[e.saleId,e.method,e.date].join('|');represented.set(k,(represented.get(k)||0)+e.amount);}}
 for(const sale of data.sales){
  const expected=new Map(),receiptKeys=new Set(),saleKeys=new Set();
  for(const payment of sale.payments||[]){
   if(payment.method==='debt'||payment.date<from||payment.date>to)continue;
   const key=[sale.id,payment.method,payment.date].join('|');expected.set(key,(expected.get(key)||0)+payment.amount);(payment.kind==='receipt'?receiptKeys:saleKeys).add(key);
  }
  for(const [key,total] of expected){
   const missing=Math.max(0,total-(represented.get(key)||0));
   if(missing){const [,method,dateValue]=key.split('|');entries.push({id:'summary-'+key,shiftId:'',method,amount:missing,description:'Venda '+sale.number+' — entrada recuperada do cadastro da venda',date:dateValue,createdAt:dateValue+'T12:00:00.000Z',user:sale.user||'Sistema',saleId:sale.id,kind:receiptKeys.has(key)&&!saleKeys.has(key)?'receipt':undefined,reconstructed:true});}
  }
 }
 return entries;
}

let csvKind='products';
function normalizeHeader(value){return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function parseCsv(text){
 text=text.replace(/^\uFEFF/,'');
 const first=text.split(/\r?\n/)[0];
 const delimiters=[';',',','\t'];
 const separator=delimiters.sort((a,b)=>first.split(b).length-first.split(a).length)[0];
 const rows=[];let row=[],value='',quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(ch==='"'){
   if(quoted&&text[i+1]==='"'){value+='"';i++;}
   else if(quoted)quoted=false;
   else if(!value)quoted=true;
   else value+=ch;
  }else if(ch===separator&&!quoted){row.push(value);value='';}
  else if((ch==='\n'||ch==='\r')&&!quoted){
   if(ch==='\r'&&text[i+1]==='\n')i++;
   row.push(value);if(row.some(v=>v.trim()))rows.push(row);row=[];value='';
  }else value+=ch;
 }
 if(quoted)fail('O CSV tem aspas sem fechamento. Exporte o arquivo novamente.');
 row.push(value);if(row.some(v=>v.trim()))rows.push(row);
 if(rows.length<2)fail('O CSV precisa ter cabeçalho e pelo menos um cadastro.');
 const header=rows.shift().map(normalizeHeader);
 if(new Set(header.filter(Boolean)).size!==header.filter(Boolean).length)fail('O CSV contém cabeçalhos repetidos.');
 return {header,rows};
}
function readCsvRecords(text,kind){
 const parsed=parseCsv(text);
 const aliases={
  sku:['codigo','sku','codigoproduto'],barcode:['codigodebarras','codigobarras','barras','ean'],
  name:kind==='products'?['produto','nomedoproduto','nomeproduto','nome']:['cliente','nomedocliente','nomecliente','nome'],
  qty:['estoque','estoqueatual','quantidade','qtde'],min:['minimo','estoqueminimo'],cost:['compra','comprars','valordecompra','vunitcompra','valorunitcompra'],price:['venda','vendars','preco','precodevenda','vunitvarejo','valorunitvarejo','varejo'],
  brand:['marca'],unit:['unidade','unidadedemedida','unidmedida'],type:['tipo'],document:['cpfcnpj','cpf','cnpj','documento'],phone:['telefone','celular','telcelular','telefonecelular'],email:['email'],address:['endereco'],note:['observacoes','outrasinformacoes','nota']
 };
 const indices=Object.fromEntries(Object.entries(aliases).map(([key,names])=>[key,parsed.header.findIndex(h=>names.includes(h))]));
 if(indices.name<0)fail('Não foi encontrada a coluna '+(kind==='products'?'Produto / Nome do Produto':'Cliente / Nome')+'. Use o modelo disponível em Ajustes.');
 if(kind==='products'&&indices.sku<0)fail('O CSV de produtos precisa da coluna Código.');
 const stock=(value,label)=>{
  let normalized=String(value||'0').trim();
  if(normalized.includes(','))normalized=normalized.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(normalized))normalized=normalized.replace(/\./g,'');
  return integer(normalized,label);
 };
 const seen=new Set();
 return parsed.rows.map((cells,line)=>{
  const get=key=>indices[key]>=0?String(cells[indices[key]]||'').trim():'';
  try{
   const name=get('name');if(!name)fail('Nome vazio.');
   let result;
   if(kind==='products'){
    const sku=get('sku');if(!sku)fail('Código vazio.');
    const key=sku.toLowerCase();if(seen.has(key))fail('Código repetido no CSV: '+sku);seen.add(key);
    result={id:id(),version:1,name,sku,barcode:get('barcode'),brand:get('brand'),supplierId:'',unit:get('unit')||'UN',type:['servico','service'].includes(normalizeHeader(get('type')))?'service':'product',qty:stock(get('qty'),'Estoque'),min:stock(get('min'),'Mínimo'),cost:cents(get('cost'),'Compra'),price:cents(get('price'),'Venda')};
   }else result={id:id(),version:1,name,document:get('document'),phone:get('phone'),email:get('email'),address:get('address'),note:get('note')};
   return result;
  }catch(error){fail('Linha '+(line+2)+' do CSV: '+error.message);}
 });
}
function readCashHistoryRecords(text){
 const parsed=parseCsv(text),required=['sourceid','date','time','method','amountcents','description','recordtype','salenumber','operator'];
 const idx=Object.fromEntries(required.map(key=>[key,parsed.header.indexOf(key)]));
 if(required.some(key=>idx[key]<0))fail('Este não é o CSV de histórico de caixa do NPC SMART.');
 const seen=new Set();
 return parsed.rows.map((cells,line)=>{
  const get=key=>String(cells[idx[key]]||'').trim();
  try{
   const sourceId=get('sourceid'),dateValue=get('date'),time=get('time'),method=get('method'),amount=Number(get('amountcents'));
   if(!sourceId||seen.has(sourceId))fail('Identificador de origem vazio ou repetido.');seen.add(sourceId);
   if(!/^\d{4}-\d{2}-\d{2}$/.test(dateValue)||dateValue<'2025-01-01')fail('O período deve começar em 01/01/2025.');
   if(!/^\d{2}:\d{2}:\d{2}$/.test(time)||!['cash','pix','debit','credit','other'].includes(method))fail('Data, hora ou forma de pagamento inválida.');
   if(!Number.isSafeInteger(amount))fail('Valor em centavos inválido.');
   return {sourceId,date:dateValue,time,method,amount,description:get('description').slice(0,300),recordType:get('recordtype'),saleNumber:get('salenumber'),operator:get('operator')||'Sistema antigo'};
  }catch(error){fail('Linha '+(line+2)+' do CSV: '+error.message);}
 });
}
function alreadyOnlinePayment(row,db=data){
 if(row.recordType!=='sale_payment'||!row.saleNumber)return false;
 return db.sales.some(s=>String(s.number)===row.saleNumber&&s.date===row.date&&s.payments.some(p=>p.method===row.method&&p.amount===row.amount));
}
function importCashPreview(records){
 const ids=new Set(data.ledger.map(e=>e.legacySourceId).filter(Boolean));
 const unseen=records.filter(r=>!ids.has(r.sourceId)),duplicates=records.length-unseen.length;
 const already=unseen.filter(r=>alreadyOnlinePayment(r)).length;
 const eligible=unseen.filter(r=>!alreadyOnlinePayment(r));
 const from=records.reduce((a,r)=>r.date<a?r.date:a,records[0].date),to=records.reduce((a,r)=>r.date>a?r.date:a,records[0].date);
 return {unseen,duplicates,already,eligible,from,to};
}

submits['cash-history-import']=async()=>{
 const {records,preview}=dialogState;let added=0,skippedDuplicate=0,skippedOnline=0;
 await transaction((db,user)=>{
  admin(user);const known=new Set(db.ledger.map(e=>e.legacySourceId).filter(Boolean));
  const eligible=records.filter(r=>{if(known.has(r.sourceId)){skippedDuplicate++;return false;}if(alreadyOnlinePayment(r,db)){skippedOnline++;return false;}return true;});
  const byDate=new Map();
  for(const row of eligible){let shift=byDate.get(row.date)||db.shifts.find(s=>s.historical&&s.legacyDate===row.date);
   if(!shift){const open=new Date(row.date+'T00:00:00'),close=new Date(row.date+'T23:59:59');shift={id:id(),number:'MDB '+row.date,openedAt:open.toISOString(),openedBy:'Importação MDB',closedAt:close.toISOString(),closedBy:'Importação MDB',note:'Histórico importado do banco Access',historical:true,legacyDate:row.date};db.shifts.push(shift);byDate.set(row.date,shift);}
   db.ledger.push({id:id(),shiftId:shift.id,method:row.method,amount:row.amount,description:row.description,date:row.date,createdAt:new Date(row.date+'T'+row.time).toISOString(),user:row.operator,legacySourceId:row.sourceId,legacySaleNumber:row.saleNumber,legacyType:row.recordType});added++;
  }
 });
 closeDialog();renderMain();toast(added+' lançamentos históricos importados. '+(skippedDuplicate+skippedOnline)+' já existentes foram ignorados.');
};
function csvExists(rows,row,kind){
 if(kind==='products')return rows.some(p=>p.sku.toLowerCase()===row.sku.toLowerCase()||(row.barcode&&p.barcode===row.barcode));
 return rows.some(c=>(row.document&&c.document===row.document)||(!row.document&&c.name.toLowerCase()===row.name.toLowerCase()&&c.phone===row.phone));
}

$('#csv-file').addEventListener('change',async event=>{
 const file=event.target.files[0];if(!file)return;
 try{
  admin();if(file.size>10*1024*1024)fail('O CSV excede 10 MB.');
  const buffer=await file.arrayBuffer();let text;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(buffer);}catch{text=new TextDecoder('windows-1252').decode(buffer);}
  if(csvKind==='cash-history'){
   const records=readCashHistoryRecords(text);if(!records.length)fail('O CSV não contém lançamentos.');
   const preview=importCashPreview(records);
   openDialog('Importar histórico do caixa','<form data-form="cash-history-import"><p>Período do arquivo: <b>'+date(preview.from)+' a '+date(preview.to)+'</b></p><p><b>'+records.length+'</b> lançamentos lidos; <b>'+preview.eligible.length+'</b> serão acrescentados; <b>'+preview.duplicates+'</b> já importados e <b>'+preview.already+'</b> pagamentos já existentes nesta conta serão ignorados.</p><p class="help">Importação somente de 2025 em diante. Os dados atuais são mantidos; não sobrescreve vendas nem caixa. Faça um backup antes de confirmar. Abertura e fechamento antigos entram como marcações sem alterar o total.</p>'+table(['Data','Forma','Valor','Descrição'],preview.eligible.slice(0,8).map(r=>[date(r.date),methods[r.method],money(r.amount),esc(r.description)]))+buttonsSave('Acrescentar histórico')+'</form>',{kind:'cash-history',records,preview});return;
  }
  const records=readCsvRecords(text,csvKind),existing=records.filter(r=>csvExists(data[csvKind],r,csvKind)).length;
  openDialog('Importar '+(csvKind==='products'?'produtos':'clientes')+' do CSV','<form data-form="csv-import"><p><b>'+records.length+'</b> cadastros lidos. <b>'+existing+'</b> já existem e serão conservados.</p>'+table(['Nome',csvKind==='products'?'Código':'Documento'],records.slice(0,6).map(r=>[esc(r.name),esc(csvKind==='products'?r.sku:r.document)]))+'<p class="help">A importação acrescenta os novos cadastros. Códigos e clientes já cadastrados são ignorados.</p>'+buttonsSave('Importar cadastros')+'</form>',{kind:csvKind,records});
 }catch(error){toast(error.message||String(error));}
});
